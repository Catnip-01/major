# SQL query templates
summary_report_categories: "SELECT category, SUM(amount) as total FROM transactions WHERE device_id = ? GROUP BY category"
summary_report_banks: "SELECT bank, SUM(amount) as total FROM transactions WHERE device_id = ? GROUP BY bank"
get_recent_transactions: "SELECT * FROM transactions WHERE device_id = ? ORDER BY created_at DESC LIMIT ?"
get_all_devices: "SELECT DISTINCT device_id FROM transactions"
delete_transactions: "DELETE FROM transactions WHERE device_id = ?"
delete_reports: "DELETE FROM reports WHERE device_id = ?"

# Advanced Analytics Queries
spending_by_day_of_week: |
  SELECT 
    CASE CAST(strftime('%w', date) AS INT)
      WHEN 0 THEN 'Sun' WHEN 1 THEN 'Mon' WHEN 2 THEN 'Tue' WHEN 3 THEN 'Wed' 
      WHEN 4 THEN 'Thu' WHEN 5 THEN 'Fri' WHEN 6 THEN 'Sat'
    END as day,
    SUM(amount) as total 
  FROM transactions 
  WHERE device_id = ? AND type = 'debit'
  GROUP BY day 
  ORDER BY strftime('%w', date)

merchant_frequency: |
  SELECT merchant, COUNT(*) as count, SUM(amount) as total 
  FROM transactions 
  WHERE device_id = ? AND type = 'debit'
  GROUP BY merchant 
  ORDER BY count DESC 
  LIMIT 5

savings_rate_data: |
  SELECT 
    type, 
    SUM(amount) as total 
  FROM transactions 
  WHERE device_id = ? 
  GROUP BY type

average_transaction_value: |
  SELECT AVG(amount) as avg_value 
  FROM transactions 
  WHERE device_id = ? AND type = 'debit'

micro_transactions: |
  SELECT SUM(amount) as total, COUNT(*) as count 
  FROM transactions 
  WHERE device_id = ? AND amount < 100 AND type = 'debit'

time_of_day_breakdown: |
  SELECT 
    CASE 
      WHEN CAST(strftime('%H', date) AS INT) BETWEEN 6 AND 11 THEN 'Morning'
      WHEN CAST(strftime('%H', date) AS INT) BETWEEN 12 AND 17 THEN 'Afternoon'
      WHEN CAST(strftime('%H', date) AS INT) BETWEEN 18 AND 23 THEN 'Evening'
      ELSE 'Night'
    END as slot,
    SUM(amount) as total,
    COUNT(*) as count
  FROM transactions 
  WHERE device_id = ? AND type = 'debit'
  GROUP BY slot

heavy_hitters: |
  SELECT merchant, amount, date 
  FROM transactions 
  WHERE device_id = ? AND type = 'debit' 
  ORDER BY amount DESC 
  LIMIT 5

bank_usage: |
  SELECT bank, SUM(amount) as total, COUNT(*) as count
  FROM transactions
  WHERE device_id = ? AND type = 'debit'
  GROUP BY bank
  ORDER BY total DESC

daily_spending_stats: |
  SELECT 
    strftime('%Y-%m-%d', date) as day,
    SUM(amount) as total
  FROM transactions 
  WHERE device_id = ? AND type = 'debit' AND date >= date('now', '-14 days')
  GROUP BY day
  ORDER BY day ASC

subscription_candidates: |
  SELECT merchant, amount, COUNT(*) as count
  FROM transactions 
  WHERE device_id = ? AND type = 'debit'
  GROUP BY merchant, amount
  HAVING count >= 2
  ORDER BY count DESC
